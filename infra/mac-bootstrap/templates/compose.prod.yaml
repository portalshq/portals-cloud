services:
  postgres:
    image: ${POSTGRES_IMAGE_DIGEST:?POSTGRES_IMAGE_DIGEST is required}
    restart: unless-stopped
    env_file: ${POSTGRES_ENV_FILE:?POSTGRES_ENV_FILE is required}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/postgres-tls/server.crt
      - -c
      - ssl_key_file=/run/secrets/postgres-tls/server.key
      - -c
      - ssl_ca_file=/run/secrets/postgres-tls/ca.crt
      - -c
      - hba_file=/run/secrets/postgres-tls/pg_hba.conf
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - password_encryption=scram-sha-256
    expose:
      - "5432"
    ports:
      - "${RELAY_WIREGUARD_IP:?RELAY_WIREGUARD_IP is required}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${POSTGRES_SECRET_DIR:?POSTGRES_SECRET_DIR is required}:/run/secrets/postgres:ro
      - ${POSTGRES_TLS_DIR:?POSTGRES_TLS_DIR is required}:/run/secrets/postgres-tls:ro
    networks:
      default:
        aliases:
          - db.portals.works
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]

  auth-gateway:
    image: ${AUTH_GATEWAY_IMAGE_DIGEST:?AUTH_GATEWAY_IMAGE_DIGEST is required}
    restart: unless-stopped
    env_file: ${AUTH_ENV_FILE:?AUTH_ENV_FILE is required}
    ports:
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:8086:8086"
      - "127.0.0.1:8087:8087"
    volumes:
      - ${AUTH_SECRET_DIR:?AUTH_SECRET_DIR is required}:/run/secrets/auth:ro
      - ${AUTH_DB_TLS_DIR:?AUTH_DB_TLS_DIR is required}:/run/secrets/auth-db:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    security_opt: [no-new-privileges:true]

  lore:
    image: ${LORE_IMAGE_DIGEST:?LORE_IMAGE_DIGEST is required}
    restart: unless-stopped
    env_file:
      - ${LORE_ENV_FILE:?LORE_ENV_FILE is required}
      - ${LORE_AWS_ENV_FILE:?LORE_AWS_ENV_FILE is required}
    ports:
      - "127.0.0.1:41337:41337/tcp"
      - "127.0.0.1:41337:41337/udp"
      - "${RELAY_WIREGUARD_IP:?RELAY_WIREGUARD_IP is required}:41337:41337/udp"
      - "127.0.0.1:41339:41339"
    volumes:
      - lore-cache:/data
      - ${LORE_QUIC_CERT_DIR:?LORE_QUIC_CERT_DIR is required}:/run/secrets/lore-quic:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m,mode=1777']
    security_opt: [no-new-privileges:true]

  caddy:
    image: ${CADDY_IMAGE_DIGEST:?CADDY_IMAGE_DIGEST is required}
    restart: unless-stopped
    env_file: ${CADDY_ENV_FILE:?CADDY_ENV_FILE is required}
    ports:
      - "127.0.0.1:8443:443"
      - "${RELAY_WIREGUARD_IP:?RELAY_WIREGUARD_IP is required}:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_CERT_DIR:?CADDY_CERT_DIR is required}:/run/secrets/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    security_opt: [no-new-privileges:true]
    networks:
      default:
        aliases:
          - ${AUTH_DOMAIN:?AUTH_DOMAIN is required}

volumes:
  postgres-data:
  lore-cache:
  caddy-data:
  caddy-config:

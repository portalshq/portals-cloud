<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">Portals Mac-hosted public relay architecture</title>
  <desc id="desc">Public clients use an EC2 WireGuard relay for Auth, Lore and Lore QUIC. Optional web apps use Cloudflare Tunnel. Applications and databases run privately on andresb.</desc>
  <defs>
    <style>
      .bg{fill:#09111f}.group{fill:#111d31;stroke:#385273;stroke-width:2}.box{fill:#182a44;stroke:#75b6ff;stroke-width:2}.edge{fill:#352455;stroke:#cf9dff;stroke-width:2}.mac{fill:#173c35;stroke:#64d6b7;stroke-width:2}.text{fill:#edf4ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.small{fill:#b9c9df;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.label{fill:#edf4ff;font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{fill:#fff;font:700 30px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.arrow{stroke:#9ac7ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#b99cff;stroke-width:3;fill:none;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ac7ff"/></marker>
  </defs>
  <rect class="bg" width="1440" height="880" rx="24"/>
  <text x="60" y="65" class="title">Portals: Mac-hosted workloads with a public EC2 relay</text>
  <text x="60" y="96" class="small">No router public IP · EC2 forwards only TCP/UDP · applications and data remain on andresb</text>

  <rect x="55" y="150" width="250" height="560" rx="16" class="group"/><text x="80" y="190" class="label">Public internet</text>
  <rect x="85" y="235" width="190" height="78" rx="12" class="box"/><text x="116" y="267" class="label">PX / browsers</text><text x="115" y="293" class="small">Customers</text>
  <rect x="85" y="410" width="190" height="100" rx="12" class="box"/><text x="112" y="444" class="label">Public DNS</text><text x="107" y="472" class="small">auth · lore · quic</text><text x="115" y="494" class="small">app subdomains</text>

  <rect x="405" y="130" width="305" height="620" rx="16" class="edge"/><text x="432" y="170" class="label">AWS EC2 relay</text><text x="432" y="198" class="small">Only public IP and network forwarding</text>
  <rect x="440" y="245" width="235" height="92" rx="12" class="box"/><text x="468" y="278" class="label">TCP 443</text><text x="467" y="307" class="small">Auth + Lore HTTPS/gRPC</text>
  <rect x="440" y="375" width="235" height="92" rx="12" class="box"/><text x="468" y="408" class="label">UDP 443</text><text x="467" y="437" class="small">Lore QUIC only</text>
  <rect x="440" y="530" width="235" height="120" rx="12" class="box"/><text x="468" y="564" class="label">WireGuard</text><text x="467" y="592" class="small">Encrypted, outbound Mac peer</text><text x="467" y="619" class="small">No SSH; SSM administration</text>

  <rect x="835" y="130" width="540" height="620" rx="16" class="mac"/><text x="865" y="170" class="label">andresb — FileVault, portals-svc</text><text x="865" y="198" class="small">All app and database workloads remain private</text>
  <rect x="875" y="245" width="195" height="90" rx="12" class="box"/><text x="914" y="280" class="label">Caddy</text><text x="899" y="309" class="small">TLS + SNI routes</text>
  <rect x="1125" y="245" width="200" height="90" rx="12" class="box"/><text x="1146" y="280" class="label">Auth Gateway</text><text x="1151" y="309" class="small">private container</text>
  <rect x="875" y="390" width="195" height="105" rx="12" class="box"/><text x="933" y="426" class="label">Lore</text><text x="899" y="454" class="small">gRPC + QUIC container</text><text x="899" y="478" class="small">not LAN/public bound</text>
  <rect x="1125" y="390" width="200" height="105" rx="12" class="box"/><text x="1178" y="426" class="label">Apps</text><text x="1151" y="454" class="small">optional public apps</text><text x="1151" y="478" class="small">separate processes</text>
  <rect x="990" y="575" width="220" height="90" rx="12" class="box"/><text x="1050" y="610" class="label">Database</text><text x="1012" y="638" class="small">private Docker network</text>

  <rect x="835" y="785" width="540" height="60" rx="12" class="edge"/><text x="860" y="822" class="label">Optional apps: Cloudflare Tunnel → local process (HTTPS only)</text>

  <path class="arrow" d="M275 274 H390 H440"/><text x="316" y="258" class="small">TCP / UDP 443</text>
  <path class="arrow" d="M275 460 H380 V300 H440"/><text x="316" y="443" class="small">DNS points relay</text>
  <path class="dash" d="M675 290 H875"/><text x="730" y="273" class="small">WireGuard</text>
  <path class="dash" d="M675 420 H790 V443 H875"/>
  <path class="arrow" d="M1070 290 H1125"/><path class="arrow" d="M1070 442 H1125"/>
  <path class="arrow" d="M1225 335 V575 H1210"/><path class="arrow" d="M973 495 V575 H990"/>
  <path class="arrow" d="M1225 495 V575 H1210"/>
</svg>

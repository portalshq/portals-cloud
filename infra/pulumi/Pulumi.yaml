name: portals-platform
runtime: nodejs
description: MVP Pulumi AWS infrastructure — Lore VCS + Control Plane. Images are pre-built and pinned in infra/lore/versions.yaml (see control-plane/scripts/publish-image.sh); Pulumi does not build Docker images.
main: index.ts
config:
  projectName:
    description: Project name for resource naming
    default: portals
  environment:
    description: Environment name (dev, staging, prod)
    default: dev
  vpcCidr:
    description: VPC CIDR block
    default: "10.0.0.0/16"
  publicSubnetCidrs:
    description: Public subnet CIDR blocks (comma-separated)
    default: "10.0.1.0/24,10.0.2.0/24,10.0.3.0/24"
  databaseInstanceClass:
    description: RDS PostgreSQL instance class
    default: "db.t3.medium"
  databaseVersion:
    description: RDS PostgreSQL version
    default: "15.4"
  databaseAllocatedStorage:
    description: Allocated storage for RDS (GB)
    default: "100"
  ecsFargateCpu:
    description: Fargate task CPU units
    default: "1024"
  ecsFargateMemory:
    description: Fargate task memory (MB)
    default: "2048"
  ecsLaunchType:
    description: Fixed public-host ECS launch type. Only EC2 host networking is supported.
    default: "EC2"
  ec2InstanceCount:
    description: ECS EC2 container-instance count; the free-tier mode requires exactly one.
    default: "1"
  ec2InstanceType:
    description: ECS EC2 container instance type; the free-tier mode requires t3.micro.
    default: "t3.micro"
  ec2AmiId:
    description: Optional pinned ECS-optimized AL2023 AMI ID. Leave empty to resolve AWS's recommended SSM parameter.
    default: ""
  ec2AmiSsmParameter:
    description: Optional SSM parameter containing the approved ECS-optimized AMI ID.
    default: ""
  manualTerminationDenyUserName:
    description: IAM user for the human deployer; this identity receives an explicit deny on manual termination of the tagged ECS host. The Auto Scaling service role remains unaffected.
    default: "portals-pulumi-deployer"
  ec2SchedulableMemoryMb:
    description: ECS task memory budget after t3.micro host overhead; the approved profile reserves 875 MB.
    default: "875"
  loreEc2Cpu:
    description: Lore CPU units when ecsLaunchType is EC2
    default: "256"
  loreEc2Memory:
    description: Lore memory reservation in MB when ecsLaunchType is EC2
    default: "256"
  authGatewayEc2Cpu:
    description: Auth Gateway CPU units when ecsLaunchType is EC2
    default: "128"
  authGatewayEc2Memory:
    description: Auth Gateway memory reservation in MB when ecsLaunchType is EC2
    default: "128"
  backendEc2Cpu:
    description: Unified BackendService CPU units when ecsLaunchType is EC2
    default: "128"
  backendEc2Memory:
    description: Unified BackendService memory reservation in MB when ecsLaunchType is EC2
    default: "128"
  memoryMonitoringEnabled:
    description: Create 80% ECS memory alarms and EventBridge OOM alerts; required when ecsLaunchType is EC2.
    default: "true"
  loreServiceDesiredCount:
    description: Desired count for Lore service
    default: "0"
  controlPlaneDesiredCount:
    description: Desired count for Control Plane service
    default: "0"
  authGatewayDesiredCount:
    description: Desired count for the private Auth Gateway runtime
    default: "0"
  backendServiceDesiredCount:
    description: Desired count for the unified invitation/lead BackendService. Requires the explicitly gated backend API edge.
    default: "0"
  leadsDatabaseUrlSecretArn:
    description: Existing Secrets Manager ARN containing the Neon LEADS_DATABASE_URL application database connection string.
    default: ""
  neonAllowlistConfirmed:
    description: Manual release assertion that the exported ECS host Elastic IP is allowlisted in Neon before BackendService starts.
    default: "false"
  leadHashKeySecretArn:
    description: Secrets Manager ARN for the HMAC key used to derive PII lookup hashes
    default: ""
  leadEncryptionKeySecretArn:
    description: Secrets Manager ARN for the AES-256-GCM key used to encrypt PII at rest
    default: ""
  backendApiSharedSecretArn:
    description: Secrets Manager ARN for the Vercel-to-LeadProcessing shared token
    default: ""
  crmApiKeySecretArn:
    description: Secrets Manager ARN for the outbound CRM API key
    default: ""
  crmWebhookSecretArn:
    description: Secrets Manager ARN for the inbound CRM webhook HMAC secret
    default: ""
  crmApiUrl:
    description: HTTPS CRM API endpoint used by BackendService
    default: ""
  emailServiceEnabled:
    description: Provision SES identity/configuration set for invitation delivery
    default: "false"
  sesDomain:
    description: SES sender domain. Publish the exported verification token as a DNS TXT record before enabling delivery.
    default: ""
  sesFromEmail:
    description: Verified SES From address for invitation email
    default: ""
  authFoundationEnabled:
    description: Bootstrap switch for Cognito, KMS signing, and gateway secrets; requires the documented deployer permission set
    default: "false"
  publicIngressEnabled:
    description: Fail-closed switch; creates only HTTPS 443 when true
    default: "false"
  publicCertificateArn:
    description: ACM certificate ARN required when public ingress is enabled
    default: ""
  loreHostname:
    description: Public Lore gRPC hostname
    default: "lore.portals.works"
  authHostname:
    description: Public Auth Gateway hostname on the shared HTTPS edge
    default: "auth.portals.works"
  backendApiPublicEnabled:
    description: Explicit release-gated switch for the Vercel-facing HTTPS backend API facade
    default: "false"
  backendApiHostname:
    description: HTTPS hostname for invitation and lead-processing API routes
    default: "api.portals.works"
  backendCorsAllowedOrigins:
    description: Comma-separated exact browser origins permitted by the backend API
    default: "https://portals.works"
  publicAppUrl:
    description: Canonical HTTPS Vercel application origin used in invitation links
    default: "https://portals.works"
  allowedIngressCidrs:
    description: Comma-separated CIDRs admitted to HTTPS 443
    default: "0.0.0.0/0"
  loreJwksEndpoint:
    description: HTTPS JWKS URL used by Lore; required before scaling up
    default: ""
  loreJwtIssuer:
    description: Exact JWT issuer used by Lore; required before scaling up
    default: ""
  authCallbackUrls:
    description: Comma-separated OAuth authorization-code callback URLs (PKCE is enforced by the public client)
    default: "http://127.0.0.1:8765/callback"
  authLogoutUrls:
    description: Comma-separated post-logout URLs
    default: "http://127.0.0.1:8765/logout"
  authDomainPrefix:
    description: Optional globally unique Cognito hosted-UI domain prefix
    default: ""
  authGatewayReady:
    description: Release assertion that the authenticated gateway and token exchange are deployed and verified
    default: "false"
  jwtRetiredKmsKeyArns:
    description: Comma-separated retired KMS public-key ARNs retained in JWKS through the longest token lifetime plus cache window
    default: ""
  jwtSigningEnabled:
    description: Publish-before-use gate; enable only after the active JWK is observable and Lore has refreshed it
    default: "false"
  securityControlsEnabled:
    description: Provision the mandatory audit baseline, Access Analyzer, WAF/logging, and targeted alarms
    default: "false"
  threatDetectionEnabled:
    description: Optional paid GuardDuty and Security Hub controls; not required by the free-tier compensating baseline
    default: "false"
  securityReviewDate:
    description: Date of the latest documented production security review (YYYY-MM-DD; must be within 90 days for public ingress)
    default: ""
  lowCostRdsSnapshotsEnabled:
    description: Schedule one native manual RDS snapshot daily when the account limits automated PITR retention
    default: "false"
  alarmNotificationEndpoint:
    description: Email endpoint subscribed to the alarm SNS topic (target health, 4xx/5xx, WAF, RDS backups)
    default: ""
  manualSnapshotRetentionCount:
    description: Number of daily Portals RDS snapshots to retain (7-35)
    default: "7"
  releaseGateApproved:
    description: Final manual release assertion after staging and production-readiness checks
    default: "false"
  credentialRotationEpoch:
    description: Change only during an approved credential-rotation event
    default: "2026-08-10-lore-security-rollout"
  loreServerImageUri:
    description: ECR digest URI for Lore server (repository@sha256:...)
    default: ""

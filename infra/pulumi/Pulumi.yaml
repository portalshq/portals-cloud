name: portals-platform
runtime: nodejs
description: MVP Pulumi AWS infrastructure — Lore VCS + Control Plane
main: index.ts
config:
  projectName:
    description: Project name for resource naming
    default: portals
  environment:
    description: Environment name (dev, staging, prod)
    default: dev
  vpcCidr:
    description: VPC CIDR block
    default: "10.0.0.0/16"
  publicSubnetCidrs:
    description: Public subnet CIDR blocks (comma-separated)
    default: "10.0.1.0/24,10.0.2.0/24,10.0.3.0/24"
  privateSubnetCidrs:
    description: Private subnet CIDR blocks (comma-separated)
    default: "10.0.10.0/24,10.0.11.0/24,10.0.12.0/24"
  databaseInstanceClass:
    description: Aurora PostgreSQL instance class
    default: "db.t3.micro"
  databaseVersion:
    description: Aurora PostgreSQL version
    default: "15.4"
  databaseAllocatedStorage:
    description: Aligned storage for Aurora (GB)
    default: "100"
  ecsFargateCpu:
    description: Fargate task CPU units
    default: "1024"
  ecsFargateMemory:
    description: Fargate task memory (MB)
    default: "2048"
  loreServiceDesiredCount:
    description: Desired count for Lore service
    default: "1"
  controlPlaneDesiredCount:
    description: Desired count for Control Plane service
    default: "1"
  controlPlaneDockerPath:
    description: Relative path to repo root for Control Plane multi-stage Docker build
    default: "../.."
  loreServerImageUri:
    description: External Docker image URI for Lore server (e.g. portalshq/lore-server:latest-amd64)
    default: "portalshq/lore-server:latest-amd64"
  ed25519SigningKey:
    description: Ed25519 signing key for data plane JWT tokens (base64-encoded, mark as secret)

  artifact_manifest_url: "https://github.com/portalshq/lore/releases/download/v0.\
    8.4-portals.5/SHA256SUMS"
  artifact_manifest_sha256: "sha256:6285c50ff490870a8417db442f75ab73d53578f52eacacd31011cd350b957457"
  signature_bundle_url: "https://github.com/portalshq/lore/releases/download/v0.8\

  # Px must install this exact top-level Lore client release. Its artifacts
  # and source provenance are recorded once under lore-client below.
  lore_client_version: "0.8.4-portals.9"
  # NOTE: v0.5.8 lacks Sigstore bundles. New release with lore-auth-v1 support needed.


# This file is the release bill of materials. Production may deploy only the
# exact compatible set recorded here; publishers update it only after their
# verification gates pass.
schema_version: 2

release:
  version: "0.2.0"
  # contained | candidate | approved
  status: "contained"
  security_contract: "lore-auth-v1"

# Nap is a signed downloadable binary, not a container image. The current
# v0.5.8 release predates the secure cloud-auth changes, so it is recorded but
# deliberately does not satisfy the production contract. A new release addressing
# lore-auth-v1 is needed.
nap-client:
  version: "0.5.12"
  source_repository: "https://github.com/portalshq/narrativeengine.git"
  source_commit: "8501e7db577d2cc0860a9dc5bc085ef1634ba0a8"
  release_tag: "v0.5.12"
  security_contract: "lore-auth-v1"
  artifact_manifest_url: "https://github.com/portalshq/narrativeengine/releases/d\
    ownload/v0.5.12/SHA256SUMS"
  artifact_manifest_sha256: "sha256:2ce79d5b68e0d38b2ed22156936db17db41631d7c9be0dffecdcd17e90f20ca3"
  signature_bundle_url: "https://github.com/portalshq/narrativeengine/releases/do\
    wnload/v0.5.12/SHA256SUMS.sigstore.json"
  # Nap must install this exact top-level Lore client release. Its artifacts
  # and source provenance are recorded once under lore-client below.
  lore_client_version: "0.8.4-portals.5"
  # NOTE: v0.5.8 lacks Sigstore bundles. New release with lore-auth-v1 support needed.

  # Lore CLI is a separately published binary dependency of Nap. Keep the
  # checked-out submodule pinned to upstream_commit until the minimal security
  # patch is committed to portalshq/lore; source_commit deliberately remains
  # empty while that fork commit and signed release do not yet exist.
lore-client:
  version: "0.8.4-portals.5"
  source_repository: "https://github.com/portalshq/lore"
  source_commit: "1c0de969560779d55966152715a909eea45241e8"

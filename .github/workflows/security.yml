name: Security Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-and-infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_gateway_test
          POSTGRES_USER: portals_test
          POSTGRES_PASSWORD: ci-integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portals_test -d auth_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify no deployable private keys or AWS access keys
        run: ./infra/pulumi/scripts/scan-repository-secrets.sh

      - name: Check and test Auth Gateway and control plane
        working-directory: control-plane
        env:
          AUTH_GATEWAY_TEST_DATABASE_URL: postgresql://portals_test:ci-integration-only@127.0.0.1:5432/auth_gateway_test
        run: |
          cargo fmt --all -- --check
          cargo test -p auth-gateway
          cargo test -p auth-gateway store::tests::postgres_persists_sessions_relationships_and_api_key_lifecycle -- --ignored --exact
          cargo check -p api

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file control-plane/Cargo.lock
          cargo audit --file infra/lore/lore/Cargo.lock

      - name: Check Lore security implementation
        working-directory: infra/lore/lore
        run: |
          cargo fmt --all -- --check
          cargo check -p lore-server

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/pulumi/package-lock.json

      - name: Test Pulumi security assertions and audit dependencies
        working-directory: infra/pulumi
        run: |
          npm ci
          npm run build
          npm test
          npm audit --omit=dev

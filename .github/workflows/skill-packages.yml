name: Skill Packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run skills:check

  # The identity store's database tests are skipped without a database, which
  # left its SQL unverified. They run here against a real PostgreSQL.
  package-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # npm ci does not install rollup's platform binary on Linux.
      - name: Install Rollup Linux native binary
        run: |
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --ignore-scripts --no-save --package-lock=false "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - run: npm test -w @portalshq/capability-identity
        env:
          IDENTITY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

name: Release Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Track, Version, and Publish
    if: github.repository == 'portalshq/portals-cloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write       # Required to create Release PRs and Git tags
      pull-requests: write  # Required to open/update the Release PR
      id-token: write       # npm Trusted Publishing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Changesets needs full git history to track changes

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # npm trusted publishing requires Node >= 22.14 and npm >= 11.5.1.
          # The hosted Node 24 runtime supplies a compatible npm CLI.
          node-version: '24'
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install Dependencies
        run: npm ci

      # The Changesets Action automates the PR creation, tagging, and execution
      - name: Run Changeset Engine
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run release:version
          publish: npm run release
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm exchanges the GitHub OIDC identity for a short-lived publishing
          # credential. Deliberately do not configure NODE_AUTH_TOKEN / NPM_TOKEN.

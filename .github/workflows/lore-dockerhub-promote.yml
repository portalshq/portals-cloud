name: Promote Existing Lore Docker Hub Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable portalshq/lore image digest
        required: true
        type: string
      base_image:
        description: Immutable portalshq/lore base image digest
        required: true
        type: string
      source_commit:
        description: Full source commit hash bound in provenance
        required: true
        type: string
      packaging_commit:
        description: Full packaging commit hash bound in provenance
        required: true
        type: string
      build_id:
        description: Build ID bound in provenance
        required: true
        type: string
      version:
        description: Lore version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    if: github.repository == 'portalshq/portals-cloud' && startsWith(github.ref, 'refs/heads/release/lore-dockerhub-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Install receipt writer dependencies
        run: npm ci --prefix infra/pulumi --omit=dev --ignore-scripts
      - name: Verify and record Docker Hub receipt
        env:
          IMAGE: ${{ inputs.image }}
          BASE_IMAGE: ${{ inputs.base_image }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PACKAGING_COMMIT: ${{ inputs.packaging_commit }}
          BUILD_ID: ${{ inputs.build_id }}
          LORE_VERSION: ${{ inputs.version }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/lore-dockerhub-release.yml@${{ github.ref }}
        run: bash infra/pulumi/scripts/verify-and-promote-dockerhub-lore.sh "$IMAGE"
      - name: Commit verified deployment receipt
        env:
          LORE_VERSION: ${{ inputs.version }}
        run: |
          git diff --quiet -- infra/lore/versions.yaml infra/lore/verified-dockerhub-images.json && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add infra/lore/versions.yaml infra/lore/verified-dockerhub-images.json
          git commit -m "chore(lore): record Docker Hub release ${LORE_VERSION}"
          git push

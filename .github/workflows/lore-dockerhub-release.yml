name: Lore Docker Hub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Lore version without the v prefix
        required: true
        type: string
  push:
    tags:
      - 'v*-portals.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build AMD64 Lore image
        id: build
        run: |
          VERSION='${{ inputs.version || github.ref_name }}'
          VERSION="${VERSION#v}"
          bash infra/lore/scripts/docker-buildx-lore-dockerhub.sh "$VERSION"
      - name: Sign immutable digest
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          COSIGN_BUNDLE: ${{ runner.temp }}/lore.sigstore.json
        run: cosign sign --yes --bundle "$COSIGN_BUNDLE" "$IMAGE"
      - name: Verify and promote Docker Hub receipt
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          BASE_IMAGE: ${{ steps.build.outputs.base_image }}
          SOURCE_COMMIT: ${{ steps.build.outputs.source_commit }}
          PACKAGING_COMMIT: ${{ steps.build.outputs.packaging_commit }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          LORE_VERSION: ${{ inputs.version || github.ref_name }}
          COSIGN_BUNDLE: ${{ runner.temp }}/lore.sigstore.json
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/lore-dockerhub-release.yml@${{ github.ref }}
        run: |
          LORE_VERSION="${LORE_VERSION#v}"
          export LORE_VERSION
          bash infra/pulumi/scripts/verify-and-promote-dockerhub-lore.sh "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: lore-dockerhub-evidence
          path: |
            ${{ runner.temp }}/lore.sigstore.json
            infra/lore/versions.yaml
            infra/lore/verified-dockerhub-images.json

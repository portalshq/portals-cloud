name: Auth Gateway Docker Hub release

on:
  workflow_dispatch:
  push:
    branches: ['release/mac-bootstrap-*']
    paths:
      - 'control-plane/**'
      - 'docker/auth-gateway/**'
      - '.github/workflows/auth-dockerhub-release.yml'
      - 'infra/pulumi/scripts/verify-and-promote-dockerhub-auth.sh'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: github.repository == 'portalshq/portals-cloud'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: auth_gateway_test
          POSTGRES_USER: portals_test
          POSTGRES_PASSWORD: ci-integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portals_test -d auth_gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Auth unit and disposable PostgreSQL integration tests
        env:
          AUTH_GATEWAY_TEST_DATABASE_URL: postgresql://portals_test:ci-integration-only@127.0.0.1:5432/auth_gateway_test
        run: |
          sudo apt-get update && sudo apt-get install --yes protobuf-compiler
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          cd control-plane
          cargo +1.97.0 fmt -p auth-gateway -- --check
          cargo +1.97.0 test --locked -p auth-gateway
          cargo +1.97.0 test --locked -p auth-gateway store::tests:: -- --ignored --test-threads=1
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Build clean source with attestations
        id: build
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse HEAD)
          PROTOCOL_COMMIT=$(git -C infra/lore/lore rev-parse HEAD)
          TAG="portalshq/auth-gateway:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_COMMIT:0:12}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true --push \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "io.portals.protocol-revision=$PROTOCOL_COMMIT" \
            --label "io.portals.build-id=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --metadata-file /tmp/auth-build.json \
            -t "$TAG" -f docker/auth-gateway/Dockerfile .
          DIGEST=$(jq -er '."containerimage.digest"' /tmp/auth-build.json)
          echo "image=portalshq/auth-gateway@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "protocol_commit=$PROTOCOL_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Sign immutable digest with GitHub identity
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and prepare promotion evidence
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          SOURCE_COMMIT: ${{ steps.build.outputs.source_commit }}
          PROTOCOL_COMMIT: ${{ steps.build.outputs.protocol_commit }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/auth-dockerhub-release.yml@${{ github.ref }}
        run: |
          npm ci --prefix infra/pulumi --omit=dev --ignore-scripts
          bash infra/pulumi/scripts/verify-and-promote-dockerhub-auth.sh "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: auth-dockerhub-evidence
          path: |
            infra/lore/versions.yaml
            infra/lore/verified-dockerhub-images.json

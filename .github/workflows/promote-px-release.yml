name: Verify PX release and propose BOM update
run-name: PX BOM ${{ inputs.release_tag }} on ${{ inputs.target_ref }} [${{ inputs.dispatch_id || github.run_id }}]

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed PX release tag, for example v0.9.8
        required: true
        type: string
      target_ref:
        description: Release branch that will receive the reviewed BOM update
        required: true
        type: string
      dispatch_id:
        description: Unique caller ID used to wait for this exact run (optional for manual dispatch)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: promote-px-release-${{ inputs.target_ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-and-propose:
    if: github.repository == 'portalshq/portals-cloud'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate release tag and release branch
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_REF: ${{ inputs.target_ref }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$TARGET_REF" == release/* ]]
          [[ "$TARGET_REF" != *..* ]]
          [[ -z "$DISPATCH_ID" || "$DISPATCH_ID" =~ ^[A-Za-z0-9-]{8,80}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: sigstore/cosign-installer@v4.0.0

      - name: Install BOM writer dependencies
        run: npm ci --prefix infra/pulumi --omit=dev --ignore-scripts

      - name: Verify PX and bundled Lore release artifacts; update candidate BOM
        env:
          GH_TOKEN: ${{ github.token }}
          PX_GITHUB_REPOSITORY: portalshq/px
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash infra/pulumi/scripts/verify-and-promote-px-release.sh "$RELEASE_TAG"

      - name: Open reviewable BOM promotion pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/px-bom-${{ inputs.release_tag }}
          base: ${{ inputs.target_ref }}
          add-paths: |
            infra/lore/versions.yaml
          delete-branch: false
          title: "chore(release): promote PX ${{ inputs.release_tag }} with verified Lore pair"
          commit-message: "chore(release): promote PX ${{ inputs.release_tag }}"
          body: |
            This PR contains the BOM and its embedded verification evidence generated by
            `verify-and-promote-px-release.sh` after Sigstore, checksums, metadata,
            Lore dependency, and source-commit verification.

            This records a tested release pair; it does not approve production
            deployment. Required integration, security, and deployment gates still
            run through the normal release process. Merge only after review.

